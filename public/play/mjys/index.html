<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0f24">
<title>魔晶要塞 · 原型</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a0f24; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { width: 100%; height: 100%; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #ffe9b0; font: 22px sans-serif; }
</style>
</head>
<body>
<div id="boot">加载中…</div>
<div id="game"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
  // 字型（docs/04）：站酷快乐体（标题）、站酷庆科黄油体（面板）、Lilita One（数字英文）
  // 只抓画面会用到的字（扫 strings.js 与 data/*.js），档案很小
  // 注意：Google Fonts 在中国大陆连不上，正式版要改成自己架字体（fonts/ 资料夹）
  (async () => {
    const files = ['strings.js', 'data/towers.js', 'data/enemies.js', 'data/stages.js', 'data/story.js', 'data/shop.js', 'data/products.js', 'data/season.js', 'data/captains.js', 'data/fortress.js', 'data/codex.js'];
    let src = '';
    await Promise.all(files.map(async f => { try { const r = await fetch(f + '?v=' + Date.now()); if (r.ok) src += await r.text(); } catch (e) { /* 没有这个档就跳过 */ } }));
    const chars = [...new Set(src.match(/[　-〿一-鿿＀-￯]/g) || [])].join('');
    const add = (family, text) => {
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=' + family + '&display=block' + (text ? '&text=' + encodeURIComponent(text) : '');
      document.head.appendChild(l);
      return new Promise(r => { l.onload = r; l.onerror = r; });
    };
    try {
      await Promise.race([
        Promise.all([add('ZCOOL+KuaiLe', chars), add('ZCOOL+QingKe+HuangYou', chars), add('Lilita+One')])
          // 字型會被切成好幾片（依字碼範圍），要拿「全部會用到的字」去載，不然只會載到第一片，其他字退回系統字型
          .then(() => Promise.all([
            document.fonts.load('40px "ZCOOL KuaiLe"', chars || '魔晶'),
            document.fonts.load('40px "ZCOOL QingKe HuangYou"', chars || '魔晶'),
            document.fonts.load('40px "Lilita One"', '0123456789+-×/%:'),
          ])),
        new Promise(r => setTimeout(r, 6000)),
      ]);
    } catch (e) { /* 字体失败就用系统字 */ }
    // 载入游戏；失败就整页重新整理一次（浏览器会记住失败的模组，原地重试没用），还不行就把错误写在画面上
    const boot = document.getElementById('boot');
    try {
      await import('./main.js?v=' + Date.now());
      try { sessionStorage.removeItem('mjys_retry'); } catch (e) { /* 无痕模式 */ }
    } catch (e) {
      let tried = false;
      try { tried = sessionStorage.getItem('mjys_retry') === '1'; sessionStorage.setItem('mjys_retry', '1'); } catch (e2) { tried = true; }
      if (!tried) { location.reload(); return; }
      boot.textContent = '载入失败，请重新整理：' + e.message;
      return;
    }
    boot.remove();
  })();
</script>
</body>
</html>
